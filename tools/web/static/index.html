<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPanel 工作台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>DPanel 工作台</h1>
  <span class="badge" id="state">未构建</span>
  <span class="hint" id="job-id"></span>
  <span class="spacer"></span>
  <span class="hint">拖动旋转 · 滚轮缩放 · 双击复位</span>
</header>
<main>
  <section id="view">
    <canvas id="scene"></canvas>
    <div id="overlay" class="overlay"></div>
  </section>
  <aside>
    <div class="card">
      <h2>参数化几何（GRASS 变量）</h2>
      <div id="params" class="params"></div>
      <div class="row">
        <button id="build" class="primary">生成几何</button>
        <button id="reset">默认值</button>
      </div>
    </div>
    <div class="card">
      <h2>求解选项</h2>
      <label>迎角 α<input id="alpha" type="number" value="4" step="0.5" min="-10" max="20"><span>deg</span></label>
      <label>尾迹<select id="wake">
        <option value="fixed">固定尾迹（快）</option>
        <option value="free">自由尾迹（慢）</option>
      </select></label>
      <label>设备<select id="device">
        <option value="cpu">torch CPU</option>
        <option value="cuda">torch GPU</option>
      </select></label>
      <label>网格尺寸<input id="size" type="number" value="0.3" step="0.05" min="0.08" max="2"><span>m</span></label>
      <label>自由尾迹迭代<input id="iterations" type="number" value="12" step="1" min="1" max="60"><span>次</span></label>
      <div class="row">
        <button id="solve" class="primary" disabled>求解</button>
        <button id="cancel" disabled>取消</button>
      </div>
      <pre id="log" class="log"></pre>
    </div>
    <div class="card">
      <h2>结果</h2>
      <table id="result"><tbody><tr><td class="muted">尚未求解</td></tr></tbody></table>
      <canvas id="plot" width="360" height="150"></canvas>
    </div>
  </aside>
</main>
<script src="/static/app.js"></script>
</body>
</html>
